name: Test and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish VERSION as Docker image and release binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xbn-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true
      - id: version
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then exit 1; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Test configuration, kernels, service and collector
        run: go test -race -p 2 -tags 'with_quic with_utls with_wireguard with_clash_api' ./internal/... ./cmd/...
      - name: Check installer syntax
        run: bash -n install.sh easy-install.sh rewrite-install.sh

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true
      - name: Build Linux programs
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          mkdir -p dist
          export GOOS=linux CGO_ENABLED=0
          go build -p 2 -tags 'with_quic with_utls with_wireguard with_clash_api' -ldflags "-s -w -X main.version=$VERSION" -o "dist/xboard-node-linux-$GOARCH" ./cmd/xboard-node
          go build -p 2 -ldflags "-s -w -X main.version=$VERSION" -o "dist/xbctl-linux-$GOARCH" ./cmd/xbctl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  docker:
    needs: [test, binaries]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kele812/xbn-plus-plus:${{ needs.test.outputs.version }}
            ghcr.io/kele812/xbn-plus-plus:latest

  release:
    needs: [test, binaries, docker]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Prepare release files and checksums
        run: |
          cp install.sh easy-install.sh rewrite-install.sh dist/
          cd dist
          sha256sum xboard-node-linux-* xbctl-linux-* *.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: xbn plus ++ ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*
